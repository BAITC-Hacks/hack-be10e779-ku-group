[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# длинные русские строки в докстрингах, промпте агента и текстах для диспетчера
"app/forecast/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
