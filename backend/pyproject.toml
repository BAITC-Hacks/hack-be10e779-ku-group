[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# длинные русские строки в докстрингах, промпте агента и текстах для диспетчера
"app/forecast/*.py" = ["E501"]
"tests/*.py" = ["E501"]
"app/api/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# стандартный приём FastAPI: Depends/File/Query в значениях по умолчанию
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Header", "app.auth.require"]

[tool.pytest.ini_options]
pythonpath = ["."]
